name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Detect, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          [[ -f build.gradle || -f build.gradle.kts || -f settings.gradle || -f settings.gradle.kts ]] && echo "gradle=true" >> "$GITHUB_OUTPUT" || echo "gradle=false" >> "$GITHUB_OUTPUT"
          [[ -f pom.xml ]] && echo "maven=true" >> "$GITHUB_OUTPUT" || echo "maven=false" >> "$GITHUB_OUTPUT"
          [[ -f package.json ]] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [[ -f pyproject.toml || -f requirements.txt ]] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          [[ -f go.mod ]] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
          [[ -f Cargo.toml ]] && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"
          if [[ ! -f build.gradle && ! -f build.gradle.kts && ! -f settings.gradle && ! -f settings.gradle.kts && ! -f pom.xml && ! -f package.json && ! -f pyproject.toml && ! -f requirements.txt && ! -f go.mod && ! -f Cargo.toml ]]; then
            echo "No supported root build manifest found; repository health check only."
          fi

      - name: Set up Gradle
        if: steps.detect.outputs.gradle == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Gradle project
        if: steps.detect.outputs.gradle == 'true'
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon build; else gradle --no-daemon build; fi

      - name: Verify Maven project
        if: steps.detect.outputs.maven == 'true'
        shell: bash
        run: |
          if [[ -f ./mvnw ]]; then chmod +x ./mvnw; ./mvnw -B -ntp verify; else mvn -B -ntp verify; fi

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install and test Node.js project
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then npm ci; else npm install; fi
          npm test --if-present
          npm run build --if-present

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python project
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then pip install -e .; fi
          python -m compileall -q .

      - name: Test Go project
        if: steps.detect.outputs.go == 'true'
        run: go test ./...

      - name: Test Rust project
        if: steps.detect.outputs.rust == 'true'
        run: cargo test

      - name: Upload Java plugin and build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            **/target/*.jar
            **/dist/*
          if-no-files-found: ignore
          retention-days: 14
