name: Build BucketCrystalOptimizer (Minimal Fabric)

on:
  push:
    branches:
      - bucketcrystaloptimizer-minimal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric 1.21.11 crystal optimizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Compile and remap mod
        run: gradle --no-daemon clean build

      - name: Verify remapped mod
        run: |
          JAR=build/libs/bucket-crystal-optimizer-1.0.0.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -qx 'fabric.mod.json'
          jar tf "$JAR" | grep -qx 'BucketCrystalOptimizer.mixins.json'
          jar tf "$JAR" | grep -q 'dev/bucketcrystaloptimizer/BucketCrystalOptimizerClient.class'
          jar tf "$JAR" | grep -q 'dev/bucketcrystaloptimizer/mixin/MultiPlayerGameModeMixin.class'
          unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "client"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": "~1.21.11"'

      - name: Package source
        run: |
          zip -r BucketCrystalOptimizer-source.zip README.md LICENSE build.gradle settings.gradle gradle.properties src

      - name: Upload mod jar and source
        uses: actions/upload-artifact@v4
        with:
          name: BucketCrystalOptimizer-Minimal-1.21.11
          path: |
            build/libs/bucket-crystal-optimizer-1.0.0.jar
            BucketCrystalOptimizer-source.zip
          if-no-files-found: error
          retention-days: 30
